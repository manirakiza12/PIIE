# =============================================================================
# PIIE — Production Deployment  (PREPARED — NOT ENABLED)
# =============================================================================
#
#   THIS WORKFLOW IS DELIBERATELY DISABLED BY THREE INDEPENDENT LOCKS:
#     1. it can ONLY be started by hand (`workflow_dispatch`); it has no
#        push or pull_request trigger, so no commit can ever deploy itself;
#     2. every job additionally requires the repository VARIABLE
#        PIIE_DEPLOY_ENABLED == 'true';
#     3. the `deploy` job runs in the `production` environment, whose
#        deployment branch policy admits the `main` branch ONLY, and which
#        requires a human reviewer.
#   Full design, rollback and activation steps: docs/DEPLOYMENT.md
#
#   WHY `on:` IS NOT COMMENTED OUT
#     A workflow file with no `on:` key at all is not a valid workflow.
#     GitHub then fails it as a zero-job run on EVERY push while still
#     showing the file as "active", which buries real CI signal in a red
#     mark that means nothing. `workflow_dispatch` is the correct way to
#     keep a workflow unreachable by automation: it is inert until a person
#     presses Run, and locks 2 and 3 still apply even then.
#
# WHAT IT DOES WHEN ENABLED
#   gate    (no secrets)  CI for the exact SHA must have succeeded; new migrations
#                         are scanned for destructive operations.
#   deploy  (environment: production, required reviewer = manual approval,
#            one at a time) downloads the artefact CI built from that SHA,
#            verifies its checksum, uploads it over SSH to
#            /home/piie/deployments/piie/, then runs deploy/remote/*.sh:
#              preflight -> [activate only: DB+storage backup, verified]
#              -> unpack, link shared .env/storage -> migrate --pretend review
#              -> [activate only: migrate --force, atomic `current` swap]
#              -> HTTP health check -> automatic CODE rollback on failure.
#
# `mode: stage` (default) unpacks and prepares a release on the server WITHOUT
# backing up, migrating or switching anything. `mode: activate` is refused by the
# server while public_html is not wired to current/public.
#
# NEVER: migrate:fresh, db:wipe, seeders, rsync --delete, writing .env, building
# on the server, or restoring the database automatically.
#
# DO NOT DISPATCH until every prerequisite in docs/DEPLOYMENT.md is met. With
# PIIE_DEPLOY_ENABLED unset both jobs skip, so a dispatch today is a no-op.
#
# SECRETS (names only; values live in GitHub, scoped to the `production`
# environment, and are never echoed):
#   PIIE_SSH_HOST  PIIE_SSH_PORT  PIIE_SSH_USER  PIIE_SSH_KEY  PIIE_SSH_KNOWN_HOSTS
# PIIE_SSH_KEY must be the v3 key (SHA256:xE5JjsJX2o4xwKnBZuiZQoOdTv+dFonLKwFq8bhCrTM);
# v1/v2 are revoked. The host key is pinned via PIIE_SSH_KNOWN_HOSTS (ED25519
# SHA256:fR4AOOMWFR17JIX9k8ed4O7+N6IaH30zEtefkbx/UEI) - never ssh-keyscan at run time.
#
# HOST FACTS (surveyed 2026-10-03): PHP 8.3.12 is /usr/local/php83/bin/php; bare
# `php` is 8.2.27. No Node on the host (assets are committed; any build runs in CI).
# =============================================================================

name: PIIE Deploy (disabled)

# ─────────────────────────────────────────────────────────────────────────────
# LOCK 1: manual trigger only. There is intentionally no `push` and no
# `pull_request` trigger, so no commit — including one merged to main — can
# deploy itself. Dispatching by hand still hits locks 2 and 3.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY TO PRODUCTION" to proceed'
        required: true
        type: string
      mode:
        description: 'stage (prepare only) or activate (backup, migrate, go live)'
        required: true
        default: stage
        type: choice
        options: [stage, activate]
      ref:
        description: 'Commit SHA to deploy (defaults to the workflow commit)'
        required: false
        default: ''
        type: string

      deployed_ref:
        description: 'Verified currently deployed commit SHA (required for activation migration comparison)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

# One deployment at a time, and never cancel one that is half-way through.
concurrency:
  group: piie-production-deploy
  cancel-in-progress: false

jobs:
  gate:
    name: Gate (no production access)
    if: ${{ vars.PIIE_DEPLOY_ENABLED == 'true' }}   # lock 2
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Require the typed confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$CONFIRM" = "DEPLOY TO PRODUCTION" ] || { echo "::error::Confirmation phrase not given."; exit 1; }

      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require a successful CI run for exactly this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/piie-ci.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          [ -n "$RUN" ] || { echo "::error::No successful PIIE CI run exists for $SHA."; exit 1; }
          echo "CI run $RUN succeeded for $SHA"
          echo "CI_RUN_ID=$RUN" >> "$GITHUB_ENV"

      - name: Resolve the base ref for the migration scan
        id: baseref
        env:
          DEPLOYED_REF: ${{ inputs.deployed_ref }}
          MODE: ${{ inputs.mode }}
        run: |
          # check-migrations.sh exits 2 when the base ref is missing, and 1 when
          # it finds something destructive. Those mean different things, so they
          # must not be collapsed into one error message.
          BASE=origin/main
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" || true
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Deployment commit is not on main."
            exit 1
          }
          if [ "$MODE" = activate ]; then
            [[ "$DEPLOYED_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Provide the verified deployed commit SHA before activation."; exit 1; }
            git cat-file -e "$DEPLOYED_REF^{commit}" || exit 1
            git merge-base --is-ancestor "$DEPLOYED_REF" HEAD || { echo "::error::Deployment requires forward migration history."; exit 1; }
            BASE="$DEPLOYED_REF"
          fi
          if git rev-parse --verify -q "$BASE" >/dev/null; then
            echo "ref=$BASE" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Base ref $BASE does not exist. Production is restricted to the main branch, so main must exist before a deployment can be gated. (check-migrations.sh exit 2 = missing ref, not a destructive migration.)"
            exit 1
          fi

      - name: Scan new migrations for destructive operations
        env:
          ALLOW: ${{ vars.ALLOW_DESTRUCTIVE_MIGRATIONS }}
        run: |
          bash deploy/check-migrations.sh "${{ steps.baseref.outputs.ref }}" || {
            [ "$ALLOW" = "1" ] || { echo "::error::Destructive migration(s) need human review (set repo variable ALLOW_DESTRUCTIVE_MIGRATIONS=1 after review)."; exit 1; }
          }

  deploy:
    name: Deploy to production
    needs: gate
    if: ${{ vars.PIIE_DEPLOY_ENABLED == 'true' }}   # lock 2
    runs-on: ubuntu-22.04
    environment: production        # configure required reviewers = manual approval
    timeout-minutes: 45
    env:
      SHA: ${{ needs.gate.outputs.sha }}
      REMOTE_BASE: /home/piie/deployments/piie
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Download the CI-built release artefact for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/piie-ci.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.workflow_runs[0].id')
          gh run download "$RUN" --name "piie-release-$SHA" --dir dist
          ls -l dist
          ( cd dist && sha256sum -c ./*.sha256 )
          bash deploy/verify-release.sh dist/piie-release-${SHA:0:12}.tar.gz

      - name: Install pinned host key and v3 deploy key
        env:
          PIIE_SSH_KEY: ${{ secrets.PIIE_SSH_KEY }}
          PIIE_SSH_KNOWN_HOSTS: ${{ secrets.PIIE_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PIIE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$PIIE_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/known_hosts ~/.ssh/deploy_key
          FP=$(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')
          [ "$FP" = "SHA256:xE5JjsJX2o4xwKnBZuiZQoOdTv+dFonLKwFq8bhCrTM" ] \
            || { echo "::error::PIIE_SSH_KEY is not the authorised v3 key."; exit 1; }
          cat > ~/.ssh/config <<EOF
          Host piie-prod
            HostName ${{ secrets.PIIE_SSH_HOST }}
            Port ${{ secrets.PIIE_SSH_PORT }}
            User ${{ secrets.PIIE_SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            PasswordAuthentication no
          EOF

      - name: Upload the on-server scripts and the artefact
        run: |
          ssh piie-prod "mkdir -p $REMOTE_BASE/incoming $REMOTE_BASE/bin"
          scp -q deploy/remote/*.sh piie-prod:$REMOTE_BASE/bin/
          scp -q deploy/docroot/index.php piie-prod:$REMOTE_BASE/bin/docroot-index.php
          scp -q dist/piie-release-${SHA:0:12}.tar.gz piie-prod:$REMOTE_BASE/incoming/
          ssh piie-prod "chmod +x $REMOTE_BASE/bin/*.sh"

      - name: Remote preflight (read-only)
        run: ssh piie-prod "$REMOTE_BASE/bin/preflight.sh"

      - name: Install the release
        env:
          MODE: ${{ inputs.mode }}
          ALLOW_DESTRUCTIVE: ${{ vars.ALLOW_DESTRUCTIVE_MIGRATIONS }}
          DEPLOYED_REF: ${{ inputs.deployed_ref }}
        run: |
          RID="$(date -u +%Y%m%d-%H%M%S)-${SHA:0:12}"
          SUM=$(cut -d' ' -f1 dist/piie-release-${SHA:0:12}.tar.gz.sha256)
          ssh piie-prod "EXPECTED_DEPLOYED_SHA=$DEPLOYED_REF ALLOW_DESTRUCTIVE_MIGRATIONS=${ALLOW_DESTRUCTIVE:-0} $REMOTE_BASE/bin/deploy-release.sh $RID $REMOTE_BASE/incoming/piie-release-${SHA:0:12}.tar.gz $SUM ${MODE:-stage}"

      - name: Public smoke check
        if: ${{ inputs.mode == 'activate' }}
        run: |
          for u in / /login /apply /applicant/login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://piie.ac.ug$u")
            echo "$u -> $code"; [ "$code" = 200 ] || [ "$code" = 302 ] || exit 1
          done

      - name: Remove key material
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts ~/.ssh/config
