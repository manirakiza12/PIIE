# ===========================================================================
# PIIE — Nginx server block for Contabo
# ---------------------------------------------------------------------------
# Companion to deploy/docroot/index.php (the release shell) and the Apache
# public/.htaccess. This file is the production web-server configuration; the
# .htaccess is the Apache equivalent and the two must stay in step.
#
# It is NOT applied by any deployment script. Installing it is a one-time VPS
# step (docs/DEPLOYMENT.md), because a deployment should never be rewriting the
# server that is serving it.
#
# Document root:  the current release's public/ directory, via the `current`
#                 symlink, so switching releases is a symlink swap and needs no
#                 reload.
#
#   root /home/piie/deployments/piie/current/public;
#
# The two blocks below are the important part of this file.
# ===========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name piie.ac.ug www.piie.ac.ug;

    # Redirect to HTTPS. Keep this commented until the certificate is installed,
    # or the site becomes unreachable.
    # return 301 https://$host$request_uri;

    # ── DOCUMENT ROOT ───────────────────────────────────────────────────────
    root /home/piie/deployments/piie/current/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32M;

    # Never expose the server version.
    server_tokens off;

    # ── 1. NEVER SERVE SENSITIVE FILES ──────────────────────────────────────
    #
    # Backstop only. The primary control is that such files are not in the
    # document root at all — a tracked 139 KB public/assets/install.sql was
    # downloadable at /assets/install.sql before this rule existed.
    #
    # Two layers, because `location` matching and `try_files` interact: a real
    # file would be served directly with no authorisation check, so it has to be
    # refused before try_files ever considers it.
    #
    #   \.sql            database dumps and schema exports
    #   \.dump / \.dmp   the same, other names
    #   \.log            application logs, which can contain request detail
    #   \.env            environment files, i.e. every credential
    #   \.key/.pem/...   private keys
    #   ^\.              dotfiles: .env, .env.production, .git*, .htpasswd
    #
    # Returns 403 rather than 404: a 404-shaped application response would still
    # route through index.php and confirm the request was handled.
    location ~* \.(sql|sql\.gz|sql\.bz2|sql\.xz|dump|dump\.gz|dmp|bak|old|orig|save|swp|log|ini|conf|env|key|pem|p12|pfx|jks|keystore)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 403;
    }

    # Dotfiles, matched on the last path segment.
    location ~ (^|/)\. {
        deny all;
        access_log off;
        log_not_found off;
        return 403;
    }

    # Private keys and SSH material by name.
    location ~* (id_rsa|id_dsa|id_ecdsa|id_ed25519|authorized_keys|known_hosts)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 403;
    }

    # ── 2. RUNTIME WRITABLE UPLODS ──────────────────────────────────────────
    #
    # shared/public-uploads is the single real copy of everything served from
    # assets/uploads. Nginx serves it directly and PHP-FPM writes it, so it needs
    # long-lived caching: these are immutable-ish, content-addressed-ish files
    # that must not be revalidated on every request.
    # Required in the installed HTTPS vhost too, before exposing historical proofs.
    location = /assets/uploads/application_payments { return 404; }
    location ^~ /assets/uploads/application_payments/ { return 404; }

    location ^~ /assets/uploads/ {
        # Must resolve through `current`. `disable_symlinks` is deliberately NOT
        # used: the whole architecture depends on this path being a symlink.
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── 3. FRONT CONTROLLER ─────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        fastcgi_param HTTP_PROXY      "";

        # Runtime errors must never reach the browser. With display_errors on, a
        # stack trace leaks paths, env values and query text to whoever triggered
        # the error.
        fastcgi_param PHP_DISPLAY_ERRORS 0;
        fastcgi_param PHP_LOG_LEVEL      "warn";
    }

    # ── 4. HEADERS ──────────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── 5. NEVER SERVE THESE AT ALL ────────────────────────────────────────
    location ~* ^/(vendor|node_modules|\.git|\.env|storage|app|bootstrap/config|tests)/ {
        deny all;
        return 403;
    }

    # ── 6. LOGGING ──────────────────────────────────────────────────────────
    access_log /home/piie/logs/piie.access.log;
    error_log  /home/piie/logs/piie.error.log warn;
}

# ===========================================================================
# HTTPS
# ---------------------------------------------------------------------------
# Uncomment together with the port-80 redirect above, once the certificate
# exists:
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name piie.ac.ug www.piie.ac.ug;
#
#     ssl_certificate     /etc/letsencrypt/live/piie.ac.ug/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/piie.ac.ug/privkey.pem;
#
#     # ... then repeat sections 1 to 6 above verbatim ...
# }
#
# The private key path is referenced, never its contents. Keep it mode 600 and
# outside the document root; `deploy/remote/preflight.sh` flags any .env or key
# material found under public_html.
# ===========================================================================
